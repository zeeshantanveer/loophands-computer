# LoopHands sandbox: keep the bot away from the Windows host (threat model S1.5, VM-T4).
# LoopHands checks these values after every import and refuses a distro that differs.
[automount]
enabled = false
mountFsTab = false

[interop]
enabled = false
appendWindowsPath = false

[user]
default = bot

[network]
generateHosts = true
generateResolvConf = true

[boot]
# Hides WSLg (/mnt/wslg and its /tmp/.X11-unix) from the guest at every boot.
command = /usr/local/sbin/loophands-boot
